query PopulateFromCrisalid($limit: Int, $offset: Int, $where: OrganizationUnitWhere) {
  organizationUnitsAggregate(where: $where) {
    count
  }
  organizationUnits(limit: $limit, offset: $offset, where: $where) {
    uid
    external
    generic_type
    national_type
    types

    long_labels {
      language
      value
    }
    short_labels {
      language
      value
    }
    local_types {
      language
      value
    }
    descriptions {
      language
      value
    }

    identifiers {
      harvester: type
      value
    }

    # parents (inclusions)
    part_ofConnection {
      edges {
        properties {
          start_date
          end_date
        }
        node {
          uid
        }
      }
    }

    # supervisions / participations
    member_ofConnection {
      edges {
        properties {
          position
          start_date
          end_date
        }
        node {
          uid
        }
      }
    }
  }
}
