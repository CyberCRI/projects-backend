#import "nodes/person.graphql"
#import "nodes/structure.graphql"

query PopulateFromCrisalid($limit: Int, $offset: Int, $where: PersonWhere) {
  peopleAggregate(where: $where) {
    count
  }
  people(limit: $limit, offset: $offset, where: $where) {
    ...PersonNode
    membershipsConnection {
      edges {
        properties {
          position_code
          start_date
          end_date
        }
        node {
          ...StructureNode
        }
      }
    }
    employmentsConnection {
      edges {
        properties {
          position_code
          start_date
          end_date
        }
        node {
          ...StructureNode
        }
      }
    }
  }
}
