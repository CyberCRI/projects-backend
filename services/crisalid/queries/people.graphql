query PopulateFromCrisalid($limit: Int, $offset: Int, $where: PersonWhere) {
  people(limit: $limit, offset: $offset, where: $where) {
    uid
    display_name
    names {
      first_names {
        language
        value
      }
      last_names {
        language
        value
      }
    }
    identifiers {
      harvester: type
      value
    }
    membershipsConnection {
      edges {
        properties {
          position_code
          start_date
          end_date
        }
        node {
          uid
        }
      }
    }
    employmentsConnection {
      edges {
        properties {
          position_code
          start_date
          end_date
        }
        node {
          uid
        }
      }
    }
  }
}
