#import "nodes/document.graphql"
#import "nodes/journal.graphql"
#import "nodes/organization.graphql"
#import "nodes/person.graphql"

query PopulateFromCrisalid($limit: Int, $offset: Int, $where: DocumentWhere) {
  documentsAggregate(where: $where) {
    count
  }
  documents(limit: $limit, offset: $offset, where: $where) {
    ...DocumentNode

    publishedInConnection {
      edges {
        properties {
          volume
          issue
          pages
        }
        node {
          ...JournalNode
        }
      }
    }

    has_contributions {
      roles
      contributor {
        ...PersonNode
      }
      affiliations {
        ...OrganizationNode
      }
    }
  }
}
